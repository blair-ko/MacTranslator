name: Build MacTranslator.app & DMG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MacTranslator.app & MacTranslator.dmg
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Package MacTranslator.app.zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent MacTranslator.app MacTranslator.app.zip

      - name: Upload Artifacts (DMG & ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: MacTranslator-macOS
          path: |
            MacTranslator.dmg
            MacTranslator.app.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacTranslator.dmg
            MacTranslator.app.zip
          generate_release_notes: true
